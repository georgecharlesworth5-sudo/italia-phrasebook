<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italiano</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f7f7;
    --warm-white: #ffffff;
    --terracotta: #222222;
    --terracotta-light: #444444;
    --terracotta-pale: #eeeeee;
    --olive: #555555;
    --olive-light: #777777;
    --midnight: #111111;
    --ink: #222222;
    --stone: #888888;
    --sand: #dddddd;
    --azure: #444444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--cream);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    background: var(--midnight);
    color: var(--cream);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(196,97,58,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(46,107,158,0.12) 0%, transparent 50%);
    pointer-events: none;
  }

  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--terracotta-light);
    margin-bottom: 0.75rem;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.1s;
  }

  header h1 {
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    font-weight: 300;
    font-style: italic;
    letter-spacing: 0.02em;
    line-height: 1.1;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.25s;
  }

  header h1 em {
    font-style: normal;
    color: var(--terracotta-light);
  }

  .header-sub {
    font-size: 1rem;
    color: var(--sand);
    margin-top: 0.75rem;
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.4s;
  }

  .header-rule {
    width: 60px;
    height: 1px;
    background: var(--terracotta);
    margin: 1.5rem auto 0;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.55s;
  }

  /* NAV DROPDOWN */
  nav {
    background: var(--warm-white);
    border-bottom: 1px solid var(--sand);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1.25rem;
    cursor: pointer;
    user-select: none;
    max-width: 1100px;
    margin: 0 auto;
  }

  .nav-current {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .nav-current-icon { font-size: 1rem; }

  .nav-arrow {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--stone);
    transition: transform 0.2s;
  }
  .nav-arrow.open { transform: rotate(180deg); }

  .nav-dropdown {
    display: none;
    background: var(--warm-white);
    border-top: 1px solid var(--sand);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    max-height: 70vh;
    overflow-y: auto;
  }
  .nav-dropdown.open { display: block; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.9rem 1.25rem;
    border: none;
    background: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--stone);
    cursor: pointer;
    text-align: left;
    border-bottom: 1px solid var(--terracotta-pale);
    transition: background 0.15s, color 0.15s;
  }
  .nav-item:last-child { border-bottom: none; }
  .nav-item:hover { background: var(--cream); color: var(--ink); }
  .nav-item.active {
    color: var(--ink);
    background: var(--terracotta-pale);
    font-weight: 500;
  }
  .nav-item-icon { font-size: 1.1rem; }
  .nav-item-label { flex: 1; }
  .nav-item-tick { color: var(--ink); font-size: 0.7rem; }


  /* MAIN LAYOUT */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  /* SECTION */
  .section {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .section.active { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--sand);
  }

  .section-icon {
    font-size: 2rem;
    line-height: 1;
  }

  .section-title {
    font-size: 2rem;
    font-weight: 300;
    font-style: italic;
    color: var(--stone);
  }

  .section-count {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--stone);
    letter-spacing: 0.1em;
    margin-left: auto;
  }

  /* SEARCH */
  .search-bar {
    position: relative;
    margin-bottom: 1.75rem;
  }

  .search-bar input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.5rem;
    border: 1px solid var(--sand);
    border-radius: 4px;
    background: var(--warm-white);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--terracotta); }
  .search-bar input::placeholder { color: var(--stone); }

  .search-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--stone);
    font-size: 0.9rem;
    pointer-events: none;
  }

  /* PHRASE GRID */
  .phrase-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }

  /* PHRASE CARD */
  .card {
    background: var(--warm-white);
    border: 1px solid var(--sand);
    border-radius: 6px;
    padding: 1.25rem 2rem 1.25rem 1.25rem;
    cursor: pointer;
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
    user-select: none;
  }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--terracotta);
    transform: scaleY(0);
    transition: transform 0.2s;
    transform-origin: bottom;
  }

  .card:hover {
    border-color: var(--terracotta-pale);
    box-shadow: 0 4px 16px rgba(196,97,58,0.1);
    transform: translateY(-1px);
  }

  .card:hover::before { transform: scaleY(1); }

  .card.flipped { background: var(--midnight); border-color: var(--midnight); }
  .card.flipped::before { background: var(--terracotta-light); transform: scaleY(1); }

  .card-italian {
    font-size: 1.25rem;
    font-style: italic;
    font-weight: 400;
    color: var(--terracotta);
    margin-bottom: 0.3rem;
    line-height: 1.3;
  }

  .card.flipped .card-italian { color: var(--terracotta-light); }

  .card-english {
    font-size: 0.95rem;
    color: var(--stone);
    font-weight: 300;
    line-height: 1.4;
    transition: color 0.2s;
  }

  .card-english:empty { display: none; }

  .card.flipped .card-english {
    color: var(--cream);
    font-size: 1rem;
  }

  .card-note {
    margin-top: 0.6rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    color: var(--olive-light);
    letter-spacing: 0.05em;
    line-height: 1.5;
  }

  .card.flipped .card-note { color: var(--olive-light); }

  .card-pron {
    margin-top: 0.35rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--sand);
    letter-spacing: 0.04em;
    line-height: 1.5;
  }

  .card.flipped .card-pron { color: var(--stone); }

  .card-flip-hint {
    position: absolute;
    bottom: 0.6rem;
    right: 0.75rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.55rem;
    color: var(--sand);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .card.flipped .card-flip-hint { color: var(--stone); }

  /* STAR / FAVOURITES */
  .card-star {
    position: absolute;
    top: 0.5rem;
    right: 0.6rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0.1rem;
    opacity: 0.25;
    transition: opacity 0.15s, transform 0.15s;
    z-index: 2;
  }
  .card-star:hover { opacity: 0.7; transform: scale(1.2); }
  .card-star.starred { opacity: 1; }
  .card.flipped .card-star { opacity: 0.4; }
  .card.flipped .card-star.starred { opacity: 1; }

  /* SPEAK BUTTON */
  .card-speak {
    display: inline-block;
    margin-top: 1rem;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0.1rem;
    opacity: 0.3;
    transition: opacity 0.15s, transform 0.15s;
    z-index: 2;
  }
  .card-speak:hover { opacity: 0.8; transform: scale(1.15); }
  .card-speak.speaking { opacity: 1; }
  .card.flipped .card-speak { opacity: 0.5; }
  .card.flipped .card-speak:hover { opacity: 0.9; }

  .card-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.4rem;
  }

  .fav-empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--stone);
    font-style: italic;
    font-size: 1.1rem;
    line-height: 1.7;
  }

  .fav-empty .fav-empty-star {
    font-size: 2rem;
    display: block;
    margin-bottom: 1rem;
    opacity: 0.3;
  }


  /* FOOTER TIP */
  .study-tip {
    margin-top: 2.5rem;
    padding: 1rem 1.25rem;
    background: var(--terracotta-pale);
    border-left: 3px solid var(--terracotta);
    border-radius: 0 4px 4px 0;
    font-size: 0.9rem;
    color: var(--ink);
  }

  .study-tip strong {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--terracotta);
    display: block;
    margin-bottom: 0.4rem;
  }

  /* NO RESULTS */
  .no-results {
    text-align: center;
    padding: 3rem;
    color: var(--stone);
    font-style: italic;
    font-size: 1.1rem;
  }

  /* QUIZ */
  .quiz-intro {
    text-align: center;
    padding: 3rem 1rem;
  }
  .quiz-intro p {
    font-size: 1.1rem;
    color: var(--stone);
    margin-bottom: 2rem;
    line-height: 1.7;
  }
  .quiz-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.85rem 2rem;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--warm-white);
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .quiz-btn:hover { background: var(--stone); border-color: var(--stone); }
  .quiz-btn.secondary {
    background: transparent;
    color: var(--ink);
    margin-left: 0.75rem;
  }
  .quiz-btn.secondary:hover { background: var(--terracotta-pale); border-color: var(--stone); }

  .quiz-question {
    background: var(--warm-white);
    border: 1px solid var(--sand);
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    position: relative;
  }
  .quiz-q-meta {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 0.6rem;
  }
  .quiz-italian {
    font-size: 1.4rem;
    font-style: italic;
    color: var(--ink);
    margin-bottom: 1rem;
    line-height: 1.3;
  }
  .quiz-input {
    width: 100%;
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--sand);
    border-radius: 4px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem;
    -webkit-text-size-adjust: 100%;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
  }
  .quiz-input:focus { border-color: var(--ink); }
  .quiz-input.correct { border-color: #4a7c59; background: #f0f7f2; }
  .quiz-input.incorrect { border-color: #a0392a; background: #fdf2f0; }
  .quiz-input:disabled { cursor: default; }

  .quiz-feedback {
    margin-top: 0.6rem;
    font-size: 0.9rem;
    line-height: 1.5;
    display: none;
  }
  .quiz-feedback.correct { color: #4a7c59; display: block; }
  .quiz-feedback.incorrect { color: #a0392a; display: block; }
  .quiz-feedback .correct-answer { font-style: italic; }

  .skip-btn {
    margin-top: 0.5rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.35rem 0.85rem;
    border: 1px solid var(--sand);
    border-radius: 4px;
    background: transparent;
    color: var(--stone);
    cursor: pointer;
    transition: all 0.15s;
  }
  .skip-btn:hover { border-color: var(--stone); color: var(--ink); }
  .skip-btn:disabled { opacity: 0.3; cursor: default; }

  .quiz-actions {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 2rem;
    flex-wrap: wrap;
  }

  .quiz-score-banner {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
  }
  .quiz-score-number {
    font-size: clamp(3rem, 10vw, 5rem);
    font-weight: 300;
    font-style: italic;
    color: var(--ink);
    line-height: 1;
  }
  .quiz-score-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--stone);
    margin-top: 0.5rem;
    margin-bottom: 0.4rem;
  }
  .quiz-score-msg {
    font-size: 1.1rem;
    color: var(--stone);
    font-style: italic;
    margin-bottom: 2rem;
  }
  .quiz-tally {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    color: var(--stone);
    margin-bottom: 2rem;
  }


  @media (max-width: 600px) {
    /* Header */
    header { padding: 1.5rem 1rem 1.25rem; }
    header h1 { font-size: 2.2rem; }
    .header-sub { font-size: 0.85rem; }
    .header-rule { margin-top: 1rem; }

    /* Main padding */
    main { padding: 1.5rem 1rem 3rem; }

    /* Section header */
    .section-title { font-size: 1.5rem; }
    .section-count { font-size: 0.6rem; }

    /* Cards — full width, slightly larger text */
    .phrase-grid { grid-template-columns: 1fr; gap: 0.75rem; }
    .card { padding: 1rem 1rem 0.85rem; }
    .card-italian { font-size: 1.2rem; }
    .card-english { font-size: 1rem; }
    .card-pron { font-size: 0.68rem; }
    .card-note { font-size: 0.65rem; }

    /* Search */
    .search-bar input { font-size: 1rem; } /* prevent iOS zoom */

    /* Quiz */
    .quiz-input { font-size: 1rem; } /* prevent iOS zoom — must be ≥16px equivalent */
    .quiz-italian { font-size: 1.2rem; }
    .quiz-q-meta { font-size: 0.62rem; }
    .quiz-score-number { font-size: 3.5rem; }
    .quiz-btn { font-size: 0.65rem; padding: 0.85rem 1.5rem; }
    .quiz-btn.secondary { margin-left: 0; margin-top: 0.5rem; }
    .quiz-actions { flex-direction: column; align-items: center; }
    .skip-btn { font-size: 0.62rem; padding: 0.4rem 1rem; }

    /* Study tip */
    .study-tip { font-size: 0.85rem; }
  }

  /* READING SECTIONS (Pinocchio) */
  .phrase-grid.reading { grid-template-columns: 1fr; max-width: 46rem; }
  .card-wordnotes {
    margin-top: 0.7rem;
    padding: 0.6rem 0 0.8rem;
    border-top: 1px solid #333;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    line-height: 1.6;
    color: #b5b5b5;
    letter-spacing: 0.02em;
  }
  .card-wordnotes b { color: var(--cream); font-weight: 400; }

  /* TWO-DROPDOWN NAV */
  .nav-bar { display: flex; max-width: 1100px; margin: 0 auto; }
  .nav-bar .nav-toggle { flex: 1; min-width: 0; max-width: none; margin: 0; padding: 0.7rem 1rem; border-bottom: 2px solid transparent; }
  .nav-bar .nav-toggle + .nav-toggle { border-left: 1px solid var(--sand); }
  .nav-bar .nav-toggle.active { border-bottom-color: var(--terracotta); }
  .nav-text { display: flex; flex-direction: column; min-width: 0; gap: 0.15rem; }
  .nav-group { font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink); }
  .nav-sub { font-size: 0.58rem; letter-spacing: 0.08em; color: var(--stone); text-transform: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-bar .nav-current { min-width: 0; }
  .nav-bar .nav-arrow { margin-left: 0.4rem; }
  .nav-book { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0.85rem 1.25rem; border: none; border-bottom: 1px solid var(--terracotta-pale); background: var(--cream); font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink); cursor: pointer; }
  .nav-book + .nav-item { padding-left: 2.25rem; }
  .nav-item + .nav-item { padding-left: 2.25rem; }
</style>
</head>
<body>

<header>
  <h1>Italiano</h1>
  <p class="header-sub">A personal phrase bank for your Italian adventure</p>
  <div class="header-rule"></div>
</header>

<nav>
  <div class="nav-bar">
    <div class="nav-toggle" id="navToggle-phrasebook" onclick="toggleNav('phrasebook')">
      <span class="nav-current">
        <span class="nav-current-icon">🗣️</span>
        <span class="nav-text"><span class="nav-group">Phrasebook</span><span class="nav-sub" id="navSub-phrasebook">Favourites</span></span>
      </span>
      <span class="nav-arrow" id="navArrow-phrasebook">▾</span>
    </div>
    <div class="nav-toggle" id="navToggle-book" onclick="toggleNav('book')">
      <span class="nav-current">
        <span class="nav-current-icon">📖</span>
        <span class="nav-text"><span class="nav-group">Book</span><span class="nav-sub" id="navSub-book">Chapters</span></span>
      </span>
      <span class="nav-arrow" id="navArrow-book">▾</span>
    </div>
  </div>
  <div class="nav-dropdown" id="navDropdown"></div>
</nav>

<main id="main"></main>

<script>
// ── DATA ────────────────────────────────────────────────────────────────────

const sections = [
  {
    id: "essentials",
    icon: "🤝",
    title: "Everyday Essentials",
    tip: "These are your foundation. Nail the pronunciation of 'prego' — it means please, you're welcome, and go ahead all at once.",
    phrases: [
      { it: "Buongiorno", en: "Good morning / Good day", note: "Use until ~1pm" },
      { it: "Buonasera", en: "Good evening", note: "Use from ~5pm onwards" },
      { it: "Buonanotte", en: "Good night", note: "Only when parting for the night" },
      { it: "Ciao", en: "Hi / Bye", note: "Informal — fine with peers, less so with strangers" },
      { it: "Arrivederci", en: "Goodbye", note: "Polite farewell" },
      { it: "Per favore / Per piacere", en: "Please", note: "'Per piacere' is slightly softer" },
      { it: "Grazie / Grazie mille", en: "Thank you / Thank you very much", note: "" },
      { it: "Prego", en: "You're welcome / Please / Go ahead", note: "The most versatile word in Italian" },
      { it: "Mi scusi", en: "Excuse me (formal)", note: "Use to get attention or apologise" },
      { it: "Scusa", en: "Excuse me (informal)", note: "" },
      { it: "Sì / No", en: "Yes / No", note: "'Sì' is stressed — say it with conviction" },
      { it: "Capisco", en: "I understand", note: "" },
      { it: "Non capisco", en: "I don't understand", note: "" },
      { it: "Può ripetere, per favore?", en: "Can you repeat that, please?", note: "Formal — very useful" },
      { it: "Parla inglese?", en: "Do you speak English?", note: "Formal — but try Italian first!" },

      { it: "C'era una volta un pezzo di legno.", en: "Once upon a time there was a piece of wood.", note: "c'era — imperfect of c'è: there was" },
      { it: "Non era un legno di lusso, ma un semplice pezzo da catasta, di quelli che d'inverno si mettono nelle stufe e nei caminetti per accendere il fuoco e per riscaldare le stanze.", en: "It wasn't luxury wood, but a plain piece of firewood, the kind that in winter people put in stoves and fireplaces to light the fire and warm the rooms.", note: "di lusso — luxury, high-class | catasta — woodpile; pezzo da catasta = ordinary firewood log | di quelli che — the kind that | si mettono — are put (impersonal si: one puts) | stufa / caminetto — stove / small fireplace | riscaldare — to heat, to warm up" },
      { it: "Non so come andasse, ma il fatto gli è che un bel giorno questo pezzo di legno capitò nella bottega di un vecchio falegname,", en: "I don't know how it happened, but the fact is that one fine day this piece of wood turned up in the workshop of an old carpenter,", note: "andasse — imperfect subjunctive after an indirect question: how it went | il fatto gli è che — the fact is that (old idiom, today il fatto è che) | un bel giorno — one fine day | capitò — passato remoto of capitare: happened to arrive | bottega — small shop or workshop" },
      { it: "il quale aveva nome mastr'Antonio, se non che tutti lo chiamavano maestro Ciliegia,", en: "who was named Mastro Antonio, except that everyone called him Master Cherry,", note: "il quale — who (formal relative pronoun) | aveva nome — was called, had the name | se non che — except that, only that | mastr'Antonio — older form of maestro Antonio; a title for a master craftsman" },
      { it: "per via della punta del suo naso, che era sempre lustra e paonazza, come una ciliegia matura.", en: "because of the tip of his nose, which was always shiny and purple-red, like a ripe cherry.", note: "per via di — because of | punta — tip | lustra — shiny, glossy | paonazza — purplish red | matura — ripe" },
      { it: "Appena maestro Ciliegia ebbe visto quel pezzo di legno, si rallegrò tutto;", en: "As soon as Master Cherry saw that piece of wood, he was filled with joy;", note: "ebbe visto — trapassato remoto: had seen; literary tense used after appena | rallegrarsi — to cheer up, to rejoice | tutto — here: completely" },
      { it: "e dandosi una fregatina di mani per la contentezza, borbottò a mezza voce:", en: "and rubbing his hands together with delight, he muttered under his breath:", note: "dandosi una fregatina di mani — rubbing his hands (literally giving himself a little rub of the hands) | borbottò — passato remoto of borbottare: muttered | a mezza voce — in a low voice" },
      { it: "— Questo legno è capitato a tempo; voglio servirmene per fare una gamba di tavolino. —", en: "“This wood has turned up just in time; I want to use it to make a table leg.”", note: "a tempo — in the nick of time, just when needed | servirmene — servirsi di + ne: to make use of it | gamba di tavolino — leg of a small table" },
      { it: "Detto fatto, prese subito l'ascia arrotata per cominciare a levargli la scorza e a digrossarlo;", en: "No sooner said than done, he immediately took his sharpened axe to start stripping off its bark and roughing it out;", note: "detto fatto — no sooner said than done | ascia — axe | arrotata — sharpened, honed | levargli la scorza — to strip its bark off (gli = from it) | digrossare — to rough-hew, to trim into shape" },
      { it: "ma quando fu lì per lasciare andare la prima asciata, rimase col braccio sospeso in aria,", en: "but just as he was about to let the first blow of the axe fall, he stopped with his arm hanging in the air,", note: "fu lì per — was on the point of, was about to | asciata — a blow with the axe | rimase — passato remoto of rimanere: stayed | sospeso — suspended" },
      { it: "perchè sentì una vocina sottile sottile, che disse raccomandandosi:", en: "because he heard a thin, tiny little voice, which said pleadingly:", note: "perchè — old spelling of perché | vocina — little voice (-ina = small, gentle) | sottile sottile — very thin; repeating an adjective makes it stronger | raccomandandosi — begging, imploring (raccomandarsi)" },
      { it: "— Non mi picchiar tanto forte! —", en: "“Don't hit me so hard!”", note: "picchiar — picchiare with the final -e dropped | tanto forte — so hard" },
      { it: "Figuratevi come rimase quel buon vecchio di maestro Ciliegia!", en: "Just imagine how that good old Master Cherry felt!", note: "figuratevi — imperative (voi) of figurarsi: imagine | come rimase — how he was left, i.e. how astonished he was" },
      { it: "Girò gli occhi smarriti intorno alla stanza per vedere di dove mai poteva essere uscita quella vocina, e non vide nessuno!", en: "He turned his bewildered eyes around the room to see where on earth that little voice could have come from, and he saw no one!", note: "smarriti — bewildered, lost | di dove mai — from where on earth (mai adds emphasis) | poteva essere uscita — could have come out | nessuno — no one" },
      { it: "Guardò sotto il banco, e nessuno:", en: "He looked under the workbench, and no one:", note: "banco — workbench" },
      { it: "guardò dentro un armadio che stava sempre chiuso, e nessuno;", en: "he looked inside a cupboard that was always kept shut, and no one;", note: "armadio — cupboard, wardrobe | stava sempre chiuso — was always (kept) closed" },
      { it: "guardò nel corbello dei trucioli e della segatura, e nessuno;", en: "he looked in the basket of wood shavings and sawdust, and no one;", note: "corbello — basket (Tuscan word) | trucioli — wood shavings | segatura — sawdust" },
      { it: "aprì l'uscio di bottega per dare un'occhiata anche sulla strada, e nessuno.", en: "he opened the shop door to take a look out in the street as well, and no one.", note: "uscio — door (literary or Tuscan for porta) | dare un'occhiata — to take a look" },
      { it: "O dunque?...", en: "Well then?...", note: "o dunque — so what is it, then? (o is a Tuscan interjection)" },
      { it: "— Ho capito; — disse allora ridendo e grattandosi la parrucca — si vede che quella vocina me la son figurata io. Rimettiamoci a lavorare. —", en: "“I get it,” he said then, laughing and scratching his wig, “it's obvious I imagined that little voice myself. Let's get back to work.”", note: "si vede che — it's clear that | me la son figurata io — I imagined it myself (son = sono; figurarsi = to imagine) | ridendo / grattandosi — gerunds: laughing / scratching himself | parrucca — wig | rimettersi a — to set about (something) again | rimettiamoci — imperative (noi) with the reflexive pronoun attached" },
      { it: "E ripresa l'ascia in mano, tirò giù un solennissimo colpo sul pezzo di legno.", en: "And taking the axe in his hand again, he brought down a mighty blow on the piece of wood.", note: "ripresa l'ascia — having taken up the axe again (participle clause) | tirò giù — brought down | solennissimo — superlative of solenne; here: tremendous | colpo — blow" },
      { it: "— Ohi! tu m'hai fatto male! — gridò rammaricandosi la solita vocina.", en: "“Ouch! You've hurt me!” cried the same little voice, complaining.", note: "ohi — ouch | m'hai fatto male — you hurt me (fare male a qualcuno) | rammaricandosi — lamenting, complaining | la solita vocina — the usual, same little voice" },
      { it: "Questa volta maestro Ciliegia restò di stucco, cogli occhi fuori del capo per la paura,", en: "This time Master Cherry was struck dumb, with his eyes popping out of his head with fear,", note: "restare di stucco — to be dumbfounded (stucco = plaster) | cogli — old form of con gli | fuori del capo — out of his head" },
      { it: "colla bocca spalancata e colla lingua giù ciondoloni fino al mento, come un mascherone da fontana.", en: "with his mouth wide open and his tongue dangling down to his chin, like a face carved on a fountain.", note: "colla — old form of con la | spalancata — wide open | ciondoloni — dangling | mento — chin | mascherone da fontana — the grotesque face carved on a fountain spout" },
      { it: "Appena riebbe l'uso della parola, cominciò a dire tremando e balbettando dallo spavento:", en: "As soon as he got his speech back, he began to say, trembling and stammering with fright:", note: "riebbe — passato remoto of riavere: got back | l'uso della parola — the power of speech | balbettare — to stammer | spavento — fright" },
      { it: "— Ma di dove sarà uscita questa vocina che ha detto ohi?...", en: "“But where can this little voice that said ouch have come from?...", note: "sarà uscita — future of probability: can have, must have come out" },
      { it: "Eppure qui non c'è anima viva.", en: "And yet there isn't a living soul here.", note: "eppure — and yet | anima viva — living soul" },
      { it: "Che sia per caso questo pezzo di legno che abbia imparato a piangere e a lamentarsi come un bambino?", en: "Could it be, by any chance, this piece of wood that has learnt to cry and moan like a child?", note: "che sia … che abbia imparato — present subjunctive: doubt in a question | per caso — by chance | lamentarsi — to complain, to moan" },
      { it: "Io non lo posso credere.", en: "I can't believe it.", note: "non lo posso credere — same as non posso crederlo; the pronoun can go before the modal verb" },
      { it: "Questo legno eccolo qui; è un pezzo di legno da caminetto, come tutti gli altri, e a buttarlo sul fuoco, c'è da far bollire una pentola di fagioli....", en: "This wood, here it is; it's a piece of fireplace wood like all the others, and if you throw it on the fire, there's enough to boil a pot of beans....", note: "eccolo — here it is (ecco + lo) | a buttarlo — by throwing it, if one throws it | c'è da far bollire — there's enough (heat) to boil | pentola — cooking pot | fagioli — beans" },
      { it: "O dunque?", en: "So then?", note: "o dunque — well then? what now?" },
      { it: "Che ci sia nascosto dentro qualcuno?", en: "Could someone be hidden inside it?", note: "che ci sia nascosto — subjunctive of doubt: could there be hidden | nascosto — hidden" },
      { it: "Se c'è nascosto qualcuno, tanto peggio per lui.", en: "If someone is hidden in there, so much the worse for him.", note: "tanto peggio — so much the worse" },
      { it: "Ora l'accomodo io! —", en: "Now I'll fix him!”", note: "accomodare — here: to deal with, to sort out (a threat: I'll fix him) | io — emphatic: I will" },
      { it: "E così dicendo, agguantò con tutt'e due le mani quel povero pezzo di legno, e si pose a sbatacchiarlo senza carità contro le pareti della stanza.", en: "And saying this, he seized that poor piece of wood with both hands and began to bang it about, without mercy, against the walls of the room.", note: "agguantare — to grab hold of | tutt'e due — both (tutte e due) | si pose a — began to | sbatacchiare — to bang about, to knock around | senza carità — without mercy | pareti — walls (of a room)" },
      { it: "Poi si messe in ascolto, per sentire se c'era qualche vocina che si lamentasse.", en: "Then he listened carefully, to hear whether there was some little voice complaining.", note: "si messe — old or Tuscan form of si mise, passato remoto of mettersi | mettersi in ascolto — to listen out, to prick up one's ears | si lamentasse — imperfect subjunctive: that might be complaining" },
      { it: "Aspettò due minuti, e nulla; cinque minuti, e nulla; dieci minuti, e nulla!", en: "He waited two minutes, and nothing; five minutes, and nothing; ten minutes, and nothing!", note: "nulla — nothing (same as niente)" },
      { it: "— Ho capito — disse allora sforzandosi di ridere e arruffandosi la parrucca — si vede che quella vocina che ha detto ohi, me la son figurata io! Rimettiamoci a lavorare. —", en: "“I get it,” he said then, forcing himself to laugh and ruffling his wig, “it's obvious I imagined that little voice that said ouch myself! Let's get back to work.”", note: "sforzarsi di — to force oneself to | arruffarsi — to ruffle, to mess up (one's own hair or wig) | rimettiamoci a lavorare — same phrase as before: let's get back to work" },
      { it: "E perchè gli era entrato addosso una gran paura, si provò a canterellare per farsi un po' di coraggio.", en: "And because a great fear had come over him, he tried humming to give himself a bit of courage.", note: "gli era entrato addosso — had taken hold of him (entrare addosso: to come over someone) | gran — short form of grande before a noun | si provò a — tried to | canterellare — to hum, to sing under one's breath | farsi coraggio — to pluck up courage" },
      { it: "Intanto, posata da una parte l'ascia, prese in mano la pialla, per piallare e tirare a pulimento il pezzo di legno;", en: "Meanwhile, having put the axe to one side, he picked up the plane, to plane the piece of wood and smooth it to a polish;", note: "intanto — meanwhile | posata l'ascia — having set the axe down | da una parte — to one side | pialla / piallare — plane (the tool) / to plane | tirare a pulimento — to smooth to a polish (old expression)" },
      { it: "ma nel mentre che lo piallava in su e in giù, sentì la solita vocina che gli disse ridendo:", en: "but while he was planing it up and down, he heard the same little voice, which said to him laughing:", note: "nel mentre che — while | in su e in giù — up and down" },
      { it: "— Smetti! tu mi fai il pizzicorino sul corpo! —", en: "“Stop! You're tickling my body!”", note: "smetti — imperative (tu) of smettere: stop | pizzicorino — a little tickle or itch (diminutive of pizzicore) | sul corpo — on my body" },
      { it: "Questa volta il povero maestro Ciliegia cadde giù come fulminato.", en: "This time poor Master Cherry fell down as if struck by lightning.", note: "cadde — passato remoto of cadere | come fulminato — as if thunderstruck" },
      { it: "Quando riaprì gli occhi, si trovò seduto per terra.", en: "When he opened his eyes again, he found himself sitting on the floor.", note: "riaprì — passato remoto of riaprire | trovarsi — to find oneself | per terra — on the ground, on the floor" },
      { it: "Il suo viso pareva trasfigurito,", en: "His face seemed transformed,", note: "pareva — seemed (parere) | trasfigurito — as printed; today trasfigurato: changed, altered" },
      { it: "e perfino la punta del naso, di paonazza come era quasi sempre, gli era diventata turchina dalla gran paura.", en: "and even the tip of his nose, from the purple-red it almost always was, had turned blue with great fear.", note: "perfino — even | di paonazza come era quasi sempre — from purplish red, as it nearly always was | turchina — blue (turquoise-blue) | gli era diventata — had become (diventare takes essere)" },
    ]
  },
  {
    id: "pinocchio2",
    icon: "📖",
    group: "book",
    book: "Pinocchio",
    title: "Pinocchio · Capitolo II",
    unit: "lines",
    reading: true,
    showNotes: true,
    noQuiz: true,
    tip: "Chapter two: Geppetto arrives, the two old friends fight over a wig, and the piece of wood goes home with him. Notice the voi form they use with each other until the fight starts, then the switch to tu.",
    phrases: [
      { it: "Maestro Ciliegia regala il pezzo di legno al suo amico Geppetto, il quale lo prende per fabbricarsi un burattino maraviglioso, che sappia ballare, tirar di scherma e fare i salti mortali.", en: "Master Cherry gives the piece of wood as a present to his friend Geppetto, who takes it to make himself a marvellous puppet, one that can dance, fence and do somersaults.", note: "regalare — to give as a present | fabbricarsi — to make for oneself | maraviglioso — old spelling of meraviglioso | che sappia — subjunctive: one that can | tirar di scherma — to fence (tirare di scherma) | salti mortali — somersaults, flips" },
      { it: "In quel punto fu bussato alla porta.", en: "At that moment there was a knock at the door.", note: "in quel punto — at that moment | fu bussato — impersonal passive: a knock was made, someone knocked | bussare — to knock" },
      { it: "— Passate pure, — disse il falegname, senza aver la forza di rizzarsi in piedi.", en: "“Come in,” said the carpenter, without having the strength to get up onto his feet.", note: "passate pure — do come in (voi imperative; pure makes it a friendly permission) | rizzarsi in piedi — to get up onto one's feet | senza aver la forza — without having the strength" },
      { it: "Allora entrò in bottega un vecchietto tutto arzillo, il quale aveva nome Geppetto;", en: "Then a sprightly little old man came into the shop, whose name was Geppetto;", note: "vecchietto — little old man (-etto is affectionate) | arzillo — spry, lively (said of old people) | il quale aveva nome — who was called" },
      { it: "ma i ragazzi del vicinato, quando lo volevano far montare su tutte le furie, lo chiamavano col soprannome di Polendina,", en: "but the boys of the neighbourhood, when they wanted to make him fly into a rage, called him by the nickname Polendina,", note: "vicinato — neighbourhood | far montare su tutte le furie — to make someone furious | soprannome — nickname | col — old contraction of con il" },
      { it: "a motivo della sua parrucca gialla, che somigliava moltissimo alla polendina di granturco.", en: "because of his yellow wig, which looked very much like cornmeal polenta.", note: "a motivo di — because of | somigliare a — to resemble | polendina — polenta, cornmeal porridge | granturco — maize, corn (old Tuscan word for mais)" },
      { it: "Geppetto era bizzosissimo.", en: "Geppetto was extremely touchy.", note: "bizzoso — quick-tempered, irritable | -issimo — superlative ending: very, extremely" },
      { it: "Guai a chiamarlo Polendina!", en: "Woe betide anyone who called him Polendina!", note: "guai a — woe to (anyone who) | chiamarlo — to call him" },
      { it: "Diventava subito una bestia, e non c'era più verso di tenerlo.", en: "He would turn into a beast at once, and there was no holding him any more.", note: "diventare una bestia — to fly into a rage | non c'era più verso di — there was no way any more to | tenerlo — to restrain him" },
      { it: "— Buon giorno, mastr'Antonio, — disse Geppetto. — Che cosa fate costì per terra?", en: "“Good day, Mastro Antonio,” said Geppetto. “What are you doing there on the floor?”", note: "fate — you do (voi form, the polite form used with one person in 1883) | costì — there, near you (Tuscan) | per terra — on the floor" },
      { it: "— Insegno l'abbaco alle formicole.", en: "“I'm teaching arithmetic to the ants.”", note: "abbaco — elementary arithmetic (from abacus) | formicole — ants (today formiche)" },
      { it: "— Buon pro vi faccia.", en: "“Much good may it do you.”", note: "buon pro vi faccia — may it do you good (set phrase) | pro — benefit, good" },
      { it: "— Chi vi ha portato da me, compar Geppetto?", en: "“What brings you to me, friend Geppetto?”", note: "chi vi ha portato — who has brought you | compar — friend, pal (short for compare, a familiar Tuscan address)" },
      { it: "— Le gambe.", en: "“My legs.”", note: "le gambe — a joking answer: my legs carried me" },
      { it: "Sappiate, mastr'Antonio, che son venuto da voi, per chiedervi un favore.", en: "Know, Mastro Antonio, that I have come to you to ask you a favour.", note: "sappiate — imperative (voi) of sapere: know, be aware | son venuto — sono venuto | chiedervi — to ask you" },
      { it: "— Eccomi qui, pronto a servirvi, — replicò il falegname rizzandosi su i ginocchi.", en: "“Here I am, ready to serve you,” replied the carpenter, raising himself up onto his knees.", note: "eccomi — here I am (ecco + mi) | pronto a — ready to | replicò — replied | rizzandosi su i ginocchi — raising himself onto his knees (today sulle ginocchia)" },
      { it: "— Stamani m'è piovuta nel cervello un'idea.", en: "“This morning an idea dropped into my head.”", note: "stamani — this morning (today stamattina) | m'è piovuta — mi è piovuta: rained down on me, i.e. occurred to me | cervello — brain" },
      { it: "— Sentiamola.", en: "“Let's hear it.”", note: "sentiamola — let's hear it (sentire + la, the idea)" },
      { it: "— Ho pensato di fabbricarmi da me un bel burattino di legno: ma un burattino maraviglioso, che sappia ballare, tirar di scherma e fare i salti mortali.", en: "“I've thought of making myself a fine wooden puppet: but a marvellous puppet, one that can dance, fence and do somersaults.", note: "fabbricarmi — to make for myself | da me — by myself | burattino — puppet, marionette | che sappia — one that can (subjunctive)" },
      { it: "Con questo burattino voglio girare il mondo, per buscarmi un tozzo di pane e un bicchier di vino:", en: "With this puppet I want to travel the world, to earn myself a crust of bread and a glass of wine:", note: "girare il mondo — to travel around the world | buscarsi — to earn, to scrape together (colloquial) | tozzo di pane — a crust, a hunk of bread | bicchier — bicchiere without the final -e" },
      { it: "che ve ne pare?", en: "what do you think of it?”", note: "che ve ne pare — what do you think about it? (parere = to seem)" },
      { it: "— Bravo Polendina! — gridò la solita vocina, che non si capiva di dove uscisse.", en: "“Bravo, Polendina!” shouted the same little voice, which you couldn't tell where it was coming from.", note: "bravo — well done (here mocking) | la solita vocina — the same little voice as before | non si capiva — it wasn't clear | di dove uscisse — where it came from (imperfect subjunctive, indirect question)" },
      { it: "A sentirsi chiamar Polendina, compar Geppetto diventò rosso come un peperone dalla bizza,", en: "On hearing himself called Polendina, friend Geppetto turned as red as a pepper with rage,", note: "a sentirsi chiamar — on hearing himself called (a + infinitive: on, upon) | peperone — (bell) pepper | bizza — fit of temper" },
      { it: "e voltandosi verso il falegname, gli disse imbestialito:", en: "and turning towards the carpenter, said to him, furious:", note: "voltarsi — to turn round | imbestialito — enraged, turned into a beast" },
      { it: "— Perchè mi offendete?", en: "“Why are you insulting me?”", note: "perchè — old spelling of perché | offendete — you insult (voi form)" },
      { it: "— Chi vi offende?", en: "“Who is insulting you?”", note: "vi — you (voi, object pronoun)" },
      { it: "— Mi avete detto Polendina!", en: "“You called me Polendina!”", note: "mi avete detto Polendina — you called me Polendina (dire + a name)" },
      { it: "— Non sono stato io.", en: "“It wasn't me.”", note: "non sono stato io — it wasn't me (essere in the passato prossimo)" },
      { it: "— Sta' un po' a vedere che sarò stato io!", en: "“Oh, so now it'll turn out it was me!”", note: "sta' un po' a vedere che — just you wait and see: it'll turn out that (sarcastic) | sarò stato — future perfect used for a guess: it must have been" },
      { it: "Io dico che siete stato voi.", en: "I say it was you.”", note: "siete stato voi — it was you (voi)" },
      { it: "— No! — Sì! — No! — Sì! —", en: "“No!” “Yes!” “No!” “Yes!”", note: "sì — yes (with an accent, unlike si)" },
      { it: "E riscaldandosi sempre più, vennero dalle parole ai fatti,", en: "And getting more and more heated, they went from words to deeds,", note: "riscaldarsi — to get worked up (also: to warm up) | sempre più — more and more | venire dalle parole ai fatti — to come to blows" },
      { it: "e acciuffatisi fra di loro, si graffiarono, si morsero e si sbertucciarono.", en: "and having seized each other by the hair, they scratched, bit and knocked each other about.", note: "acciuffarsi — to grab each other by the hair (ciuffo = tuft) | acciuffatisi — having grabbed each other (participle + attached pronoun) | si morsero — passato remoto of mordersi | sbertucciarsi — to jeer at or rough each other up" },
      { it: "Finito il combattimento, mastr'Antonio si trovò fra le mani la parrucca gialla di Geppetto,", en: "When the fight was over, Mastro Antonio found Geppetto's yellow wig in his hands,", note: "finito il combattimento — the fight being over (participle clause) | si trovò fra le mani — found in his hands | combattimento — fight, battle" },
      { it: "e Geppetto si accòrse di avere in bocca la parrucca brizzolata del falegname.", en: "and Geppetto realised he had the carpenter's grizzled wig in his mouth.", note: "accorgersi di — to notice, to realise | si accòrse — passato remoto; the accent marks the stress | brizzolata — grizzled, flecked with grey" },
      { it: "— Rendimi la mia parrucca! — gridò mastr'Antonio.", en: "“Give me back my wig!” shouted Mastro Antonio.", note: "rendimi — imperative (tu) of rendere + mi: give back to me | tu — after the fight they switch from voi to tu" },
      { it: "— E tu rendimi la mia, e rifacciamo la pace. —", en: "“And you give me back mine, and let's make peace again.”", note: "la mia — mine | rifacciamo la pace — let's make peace again (rifare)" },
      { it: "I due vecchietti, dopo aver ripreso ognuno di loro la propria parrucca,", en: "The two little old men, after each had taken back his own wig,", note: "dopo aver ripreso — after having taken back | ognuno di loro — each of them | propria — own" },
      { it: "si strinsero la mano e giurarono di rimanere buoni amici per tutta la vita.", en: "shook hands and swore to remain good friends for the rest of their lives.", note: "si strinsero la mano — shook hands (passato remoto of stringersi) | giurare di — to swear to | per tutta la vita — for life" },
      { it: "— Dunque, compar Geppetto, — disse il falegname in segno di pace fatta — qual è il piacere che volete da me?", en: "“So, friend Geppetto,” said the carpenter, as a sign that peace was made, “what is the favour you want from me?”", note: "dunque — so, well then | in segno di — as a sign of | pace fatta — peace made | qual è il piacere — what is the favour (a polite way to ask what someone wants)" },
      { it: "— Vorrei un po' di legno per fabbricare il mio burattino; me lo date? —", en: "“I'd like a bit of wood to make my puppet; will you give it to me?”", note: "vorrei — conditional of volere: I would like | un po' di — a little | me lo date — you give it to me (me + lo, voi form of dare)" },
      { it: "Mastr'Antonio, tutto contento, andò subito a prendere sul banco quel pezzo del legno che era stato cagione a lui di tante paure.", en: "Mastro Antonio, delighted, went at once to fetch from the bench that piece of wood that had been the cause of so many frights to him.", note: "tutto contento — completely happy | andò a prendere — went to get | cagione — cause (old form of causa) | era stato cagione a lui di — had caused him (literary)" },
      { it: "Ma quando fu lì per consegnarlo all'amico, il pezzo di legno dette uno scossone,", en: "But just as he was about to hand it to his friend, the piece of wood gave a jolt,", note: "fu lì per — was about to | consegnare — to hand over | dette — old form of diede, passato remoto of dare | scossone — a violent jolt" },
      { it: "e sgusciandogli violentemente dalle mani, andò a battere con forza negli stinchi impresciuttiti del povero Geppetto.", en: "and slipping violently out of his hands, went and struck hard against poor Geppetto's withered shins.", note: "sgusciare — to slip out | sgusciandogli — slipping out from him (gerund + gli) | andò a battere — ended up hitting | stinchi — shins | impresciuttiti — dried up like ham (prosciutto): withered" },
      { it: "— Ah! gli è con questo bel garbo, mastr'Antonio, che voi regalate la vostra roba?", en: "“Ah! So this is the fine manner in which you give away your things, Mastro Antonio?", note: "gli è con questo bel garbo che — it is with this fine grace that (ironic; gli è is a Tuscan expletive) | garbo — manner, courtesy | roba — stuff, belongings" },
      { it: "M'avete quasi azzoppito!...", en: "You've nearly crippled me!”", note: "m'avete — mi avete | azzoppito — as printed; the usual word is azzoppato: made lame | quasi — almost" },
      { it: "— Vi giuro che non sono stato io!", en: "“I swear it wasn't me!”", note: "giurare — to swear" },
      { it: "— Allora sarò stato io!...", en: "“Then it must have been me!...”", note: "sarò stato — future perfect of supposition, used sarcastically" },
      { it: "— La colpa è tutta di questo legno....", en: "“It's all this wood's fault....”", note: "colpa — fault, blame | tutta di — entirely (the fault) of" },
      { it: "— Lo so che è del legno: ma siete voi che me l'avete tirato nelle gambe!", en: "“I know it's the wood's: but it's you who threw it at my legs!”", note: "lo so che è del legno — I know it's the wood's (doing) | siete voi che — it is you who (cleft sentence) | me l'avete tirato — you threw it at me (me + lo) | tirare — to throw, to hurl" },
      { it: "— Io non ve l'ho tirato!", en: "“I didn't throw it at you!”", note: "ve l'ho tirato — I threw it at you (ve = a voi, l' = lo)" },
      { it: "— Bugiardo!", en: "“Liar!”", note: "bugiardo — liar" },
      { it: "— Geppetto, non mi offendete: se no vi chiamo Polendina!...", en: "“Geppetto, don't insult me: or else I'll call you Polendina!...”", note: "non mi offendete — negative imperative, voi form: don't offend me | se no — otherwise, or else" },
      { it: "— Asino! — Polendina! — Somaro! — Polendina! — Brutto scimmiotto! — Polendina! —", en: "“Donkey!” “Polendina!” “Dunce!” “Polendina!” “Ugly monkey!” “Polendina!”", note: "asino — donkey, fool | somaro — pack donkey, dunce | brutto scimmiotto — ugly little monkey (-otto)" },
      { it: "A sentirsi chiamar Polendina per la terza volta, Geppetto perse il lume degli occhi,", en: "On hearing himself called Polendina for the third time, Geppetto lost his head with rage (literally, lost the light of his eyes),", note: "per la terza volta — for the third time | perdere il lume degli occhi — to lose all self-control in anger" },
      { it: "si avventò sul falegname e lì se ne dettero un sacco e una sporta.", en: "flung himself at the carpenter, and there they gave each other a thorough beating.", note: "avventarsi su — to pounce on | darsene un sacco e una sporta — to give each other a good thrashing (idiom: a sack and a basket of blows) | dettero — old form of diedero, passato remoto of dare" },
      { it: "A battaglia finita, mastr'Antonio si trovò due graffi di più sul naso, e quell'altro due bottoni di meno al giubbetto.", en: "When the battle was over, Mastro Antonio found himself with two more scratches on his nose, and the other with two fewer buttons on his jacket.", note: "a battaglia finita — with the battle over | graffio — scratch | quell'altro — the other one (Geppetto) | di più / di meno — more / fewer | giubbetto — little jacket, waistcoat" },
      { it: "Pareggiati in questo modo i loro conti, si strinsero la mano e giurarono di rimanere buoni amici per tutta la vita.", en: "Their accounts settled in this way, they shook hands and swore to remain good friends for life.", note: "pareggiare i conti — to settle accounts, to even the score | in questo modo — in this way" },
      { it: "Intanto Geppetto prese con sè il suo bravo pezzo di legno, e ringraziato mastr'Antonio, se ne tornò zoppicando a casa.", en: "Meanwhile Geppetto took his fine piece of wood with him and, having thanked Mastro Antonio, went back home limping.", note: "intanto — meanwhile | con sè — old spelling of con sé | bravo — here: good, fine | ringraziato — having thanked | se ne tornò — went back (tornarsene) | zoppicando — limping" },
    ]
  },
  {
    id: "pinocchio3",
    icon: "📖",
    group: "book",

    title: "Pinocchio · Capitolo III",
    unit: "lines",
    reading: true,
    showNotes: true,
    noQuiz: true,
    tip: "Chapter three: Geppetto carves the puppet and names him Pinocchio, and the puppet runs away at once. Lots of body vocabulary, plus old Tuscan forms like messe and dètte.",
    phrases: [
      { it: "Geppetto, tornato a casa, comincia subito a fabbricarsi il burattino e gli mette il nome di Pinocchio.", en: "Geppetto, having returned home, begins at once to make himself the puppet and gives it the name Pinocchio.", note: "tornato a casa — having returned home (participle clause) | fabbricarsi — to make for oneself | mettere il nome — to give a name, to name" },
      { it: "Prime monellerie del burattino.", en: "The puppet's first pranks.", note: "monelleria — a naughty trick, mischief (monello = rascal)" },
      { it: "La casa di Geppetto era una stanzina terrena, che pigliava luce da un sottoscala.", en: "Geppetto's house was a little ground-floor room, which took its light from the space under a staircase.", note: "stanzina — little room | terrena — on the ground floor | pigliare — to take (Tuscan for prendere) | sottoscala — the space under a staircase" },
      { it: "La mobilia non poteva esser più semplice:", en: "The furniture couldn't have been plainer:", note: "mobilia — furniture | non poteva esser più semplice — couldn't be simpler" },
      { it: "una seggiola cattiva, un letto poco buono e un tavolino tutto rovinato.", en: "a poor chair, a not very good bed and a table that was completely ruined.", note: "seggiola — chair (today sedia) | cattiva — here: poor, bad | rovinato — ruined, battered" },
      { it: "Nella parete di fondo si vedeva un caminetto col fuoco acceso;", en: "On the back wall you could see a fireplace with a lit fire;", note: "parete di fondo — back wall | si vedeva — one could see | col — old contraction of con il | acceso — lit, switched on" },
      { it: "ma il fuoco era dipinto, e accanto al fuoco c'era dipinta una pentola che bolliva allegramente e mandava fuori una nuvola di fumo, che pareva fumo davvero.", en: "but the fire was painted, and next to the fire there was a painted pot that boiled merrily and sent out a cloud of smoke, which looked like real smoke.", note: "dipinto — painted | accanto a — next to | bollire — to boil | mandare fuori — to send out | davvero — really, truly" },
      { it: "Appena entrato in casa, Geppetto prese subito gli arnesi e si pose a intagliare e a fabbricare il suo burattino.", en: "As soon as he was inside the house, Geppetto took up his tools at once and set about carving and making his puppet.", note: "appena entrato — as soon as he had entered | arnesi — tools | si pose a — set about, began to | intagliare — to carve" },
      { it: "— Che nome gli metterò? — disse fra sè e sè.", en: "“What name shall I give him?” he said to himself.", note: "metterò — future of mettere; here: I will give (a name) | fra sè e sè — to himself (today fra sé e sé)" },
      { it: "— Lo voglio chiamar Pinocchio.", en: "“I want to call him Pinocchio.", note: "lo voglio chiamar — voglio chiamarlo: the pronoun goes before the modal verb | chiamar — chiamare without the final -e" },
      { it: "Questo nome gli porterà fortuna.", en: "This name will bring him luck.", note: "portare fortuna — to bring luck | porterà — future of portare" },
      { it: "Ho conosciuto una famiglia intera di Pinocchi: Pinocchio il padre, Pinocchia la madre e Pinocchi i ragazzi, e tutti se la passavano bene.", en: "I once knew a whole family of Pinocchi: Pinocchio the father, Pinocchia the mother and Pinocchi the children, and they were all doing well.", note: "Pinocchi — plural of pinocchio (a pine nut) | i ragazzi — the kids, the children | se la passavano bene — they were getting along well (passarsela)" },
      { it: "Il più ricco di loro chiedeva l'elemosina.", en: "The richest of them begged for alms.”", note: "il più ricco — the richest | chiedere l'elemosina — to beg for alms" },
      { it: "Quando ebbe trovato il nome al suo burattino, allora cominciò a lavorare a buono,", en: "When he had found the name for his puppet, he began to work in earnest,", note: "ebbe trovato — trapassato remoto: had found | lavorare a buono — to work in earnest (old expression)" },
      { it: "e gli fece subito i capelli, poi la fronte, poi gli occhi.", en: "and at once made its hair, then its forehead, then its eyes.", note: "capelli — hair | fronte — forehead | gli fece — made for him, made on it" },
      { it: "Fatti gli occhi, figuratevi la sua maraviglia quando si accòrse che gli occhi si movevano e che lo guardavano fisso fisso.", en: "Once the eyes were made, imagine his amazement when he noticed that the eyes were moving and staring fixedly at him.", note: "fatti gli occhi — the eyes having been made | figuratevi — imagine (voi imperative) | maraviglia — old spelling of meraviglia: amazement | si accòrse — noticed (accorgersi) | fisso fisso — fixedly; the repetition adds emphasis" },
      { it: "Geppetto vedendosi guardare da quei due occhi di legno, se n'ebbe quasi per male,", en: "Seeing himself stared at by those two wooden eyes, Geppetto almost took offence,", note: "vedendosi guardare — seeing himself looked at | avere per male — to take offence | quasi — almost" },
      { it: "e disse con accento risentito:", en: "and said in a resentful tone:", note: "accento — tone of voice | risentito — resentful" },
      { it: "— Occhiacci di legno, perchè mi guardate? —", en: "“Wooden eyes, you nasty things, why are you looking at me?”", note: "occhiacci — nasty eyes (-accio makes a word ugly or contemptuous) | guardate — you (plural) look | perchè — old spelling of perché" },
      { it: "Nessuno rispose.", en: "No one answered.", note: "rispose — passato remoto of rispondere" },
      { it: "Allora, dopo gli occhi gli fece il naso;", en: "Then, after the eyes, he made its nose;", note: "dopo gli occhi — after the eyes" },
      { it: "ma il naso, appena fatto, cominciò a crescere:", en: "but the nose, as soon as it was made, began to grow:", note: "appena fatto — as soon as made | crescere — to grow" },
      { it: "e cresci, cresci, cresci, diventò in pochi minuti un nasone che non finiva mai.", en: "and it grew and grew and grew, and in a few minutes became an enormous nose that never ended.", note: "cresci, cresci — repetition shows continuing action: it kept on growing | nasone — big nose (-one = augmentative) | che non finiva mai — that never ended" },
      { it: "Il povero Geppetto si affaticava a ritagliarlo;", en: "Poor Geppetto wore himself out trimming it;", note: "affaticarsi — to tire oneself out | ritagliare — to trim, to cut back" },
      { it: "ma più lo ritagliava e lo scorciva, e più quel naso impertinente diventava lungo.", en: "but the more he trimmed it and shortened it, the longer that cheeky nose grew.", note: "più… e più — the more… the more | scorciare — to shorten | impertinente — cheeky, insolent" },
      { it: "Dopo il naso gli fece la bocca.", en: "After the nose he made its mouth.", note: "bocca — mouth" },
      { it: "La bocca non era ancora finita di fare, che cominciò subito a ridere e a canzonarlo.", en: "The mouth wasn't even finished being made when it began at once to laugh and mock him.", note: "non era ancora finita di fare, che — hadn't yet been finished when | canzonare — to mock, to tease" },
      { it: "— Smetti di ridere! — disse Geppetto impermalito; ma fu come dire al muro.", en: "“Stop laughing!” said Geppetto, offended; but it was like talking to a wall.", note: "smetti di — stop (doing something) | impermalito — offended, piqued | fu come dire al muro — it was like talking to a wall" },
      { it: "— Smetti di ridere, ti ripeto! — urlò con voce minacciosa.", en: "“Stop laughing, I tell you!” he shouted in a threatening voice.", note: "ti ripeto — I repeat to you, I tell you again | urlò — shouted | minacciosa — threatening" },
      { it: "Allora la bocca smesse di ridere, ma cacciò fuori tutta la lingua.", en: "Then the mouth stopped laughing, but stuck out its whole tongue.", note: "smesse — Tuscan passato remoto of smettere (today smise) | cacciar fuori — to stick out, to throw out | lingua — tongue" },
      { it: "Geppetto, per non guastare i fatti suoi, finse di non avvedersene, e continuò a lavorare.", en: "Geppetto, so as not to spoil his own business, pretended not to notice, and carried on working.", note: "guastare i fatti suoi — to spoil his own affairs | fingere di — to pretend to | avvedersene — to notice it (avvedersi di + ne)" },
      { it: "Dopo la bocca gli fece il mento, poi il collo, poi le spalle, lo stomaco, le braccia e le mani.", en: "After the mouth he made its chin, then its neck, then its shoulders, stomach, arms and hands.", note: "mento — chin | collo — neck | spalle — shoulders | braccia — arms (plural of braccio)" },
      { it: "Appena finite le mani, Geppetto sentì portarsi via la parrucca dal capo.", en: "As soon as the hands were finished, Geppetto felt his wig being carried off his head.", note: "appena finite — as soon as finished | sentì portarsi via — felt (it) being taken away | capo — head" },
      { it: "Si voltò in su, e che cosa vide?", en: "He turned his eyes upwards, and what did he see?", note: "voltarsi in su — to look up" },
      { it: "Vide la sua parrucca gialla in mano del burattino.", en: "He saw his yellow wig in the puppet's hand.", note: "in mano del burattino — in the puppet's hand (today in mano al burattino)" },
      { it: "— Pinocchio!... rendimi subito la mia parrucca! —", en: "“Pinocchio!... give me back my wig at once!”", note: "rendimi — imperative (tu) of rendere + mi: give back to me | subito — at once" },
      { it: "E Pinocchio, invece di rendergli la parrucca, se la messe in capo per sè,", en: "And Pinocchio, instead of giving him back the wig, put it on his own head,", note: "invece di — instead of | rendergli — to give back to him | se la messe in capo — put it on his head (messe = old form of mise) | per sè — for himself (today per sé)" },
      { it: "rimanendovi sotto mezzo affogato.", en: "almost smothered underneath it.", note: "rimanendovi — remaining in it (gerund + vi) | mezzo affogato — half drowned, half smothered" },
      { it: "A quel garbo insolente e derisorio, Geppetto si fece tristo e melanconico, come non era stato mai in vita sua:", en: "At this insolent and mocking behaviour, Geppetto became sad and melancholy, as he had never been in his life:", note: "garbo — manner, way of behaving | derisorio — mocking | farsi tristo — to become sad | melanconico — old spelling of malinconico | in vita sua — in his whole life" },
      { it: "e voltandosi verso Pinocchio, gli disse:", en: "and turning towards Pinocchio, he said to him:", note: "voltandosi — turning round (gerund)" },
      { it: "— Birba d'un figliuolo!", en: "“You rascal of a son!", note: "birba — rascal, scamp | d'un figliuolo — of a son: what a rascal of a son | figliuolo — son (today figlio)" },
      { it: "Non sei ancora finito di fare, e già cominci a mancar di rispetto a tuo padre!", en: "You aren't even finished being made, and already you begin to show disrespect to your father!", note: "non sei ancora finito di fare — you're not yet finished being made | mancar di rispetto a — to show disrespect to" },
      { it: "Male, ragazzo mio, male! —", en: "That's bad, my boy, bad!”", note: "male — badly; here: that is bad" },
      { it: "E si rasciugò una lacrima.", en: "And he wiped away a tear.", note: "rasciugarsi — old form of asciugarsi: to dry oneself | lacrima — tear" },
      { it: "Restavano sempre da fare le gambe e i piedi.", en: "There were still the legs and the feet to make.", note: "restavano da fare — remained to be made | sempre — still" },
      { it: "Quando Geppetto ebbe finito di fargli i piedi, sentì arrivarsi un calcio sulla punta del naso.", en: "When Geppetto had finished making its feet, he felt a kick land on the tip of his nose.", note: "ebbe finito — trapassato remoto: had finished | sentì arrivarsi — felt (something) arrive at him | calcio — kick" },
      { it: "— Me lo merito — disse allora fra sè.", en: "“I deserve it,” he said then to himself.", note: "meritarsi — to deserve | me lo merito — I deserve it" },
      { it: "— Dovevo pensarci prima! Ormai è tardi! —", en: "“I should have thought of it sooner! It's too late now!”", note: "dovevo pensarci — I should have thought about it | ormai — by now, now | è tardi — it's late" },
      { it: "Poi prese il burattino sotto le braccia e lo posò in terra, sul pavimento della stanza, per farlo camminare.", en: "Then he took the puppet under its arms and set it on the ground, on the floor of the room, to make it walk.", note: "sotto le braccia — under the arms | posare — to set down | pavimento — floor | farlo camminare — to make it walk" },
      { it: "Pinocchio aveva le gambe aggranchite e non sapeva muoversi,", en: "Pinocchio's legs were stiff and he didn't know how to move,", note: "aggranchite — numb, stiff, cramped | non sapeva muoversi — didn't know how to move" },
      { it: "e Geppetto lo conduceva per la mano per insegnargli a mettere un passo dietro l'altro.", en: "and Geppetto led him by the hand to teach him to put one step after the other.", note: "condurre per la mano — to lead by the hand | insegnare a — to teach to | un passo dietro l'altro — one step after another" },
      { it: "Quando le gambe gli si furono sgranchite, Pinocchio cominciò a camminare da sè e a correre per la stanza;", en: "When his legs had loosened up, Pinocchio began to walk by himself and to run around the room;", note: "gli si furono sgranchite — had loosened up for him (trapassato remoto; sgranchirsi = to stretch out stiff limbs) | da sè — by himself (today da sé) | per la stanza — around the room" },
      { it: "finchè, infilata la porta di casa, saltò nella strada e si dètte a scappare.", en: "until, having shot through the front door, he leapt into the street and started to run away.", note: "finchè — old spelling of finché: until | infilata la porta — having gone through the door (infilare = to slip through) | si dètte a — started to (old form of si diede a) | scappare — to run away" },
      { it: "E il povero Geppetto a corrergli dietro senza poterlo raggiungere,", en: "And poor Geppetto ran after him without being able to catch him,", note: "a corrergli dietro — (went) running after him (a + infinitive narrates the action) | raggiungere — to catch up with" },
      { it: "perchè quel birichino di Pinocchio andava a salti come una lepre,", en: "because that little rascal Pinocchio was leaping like a hare,", note: "birichino — little rascal | andare a salti — to move in leaps | lepre — hare" },
      { it: "e battendo i suoi piedi di legno sul lastrico della strada, faceva un fracasso come venti paia di zoccoli da contadini.", en: "and, pounding his wooden feet on the paving of the street, he made a din like twenty pairs of peasants' clogs.", note: "battendo — pounding, beating (battere) | lastrico — paved surface of a road | fracasso — racket, din | paia — pairs (plural of paio) | zoccoli — clogs" },
      { it: "— Piglialo! piglialo! — urlava Geppetto;", en: "“Catch him! Catch him!” Geppetto kept shouting;", note: "piglialo — imperative (tu) of pigliare + lo: grab him | urlava — imperfect: kept shouting" },
      { it: "ma la gente che era per la via, vedendo questo burattino di legno, che correva come un barbero,", en: "but the people who were in the street, seeing this wooden puppet running like a racehorse,", note: "per la via — in the street | barbero — a Barbary horse, a racehorse | correre come un barbero — to run like the wind" },
      { it: "si fermava incantata a guardarlo, e rideva, rideva e rideva, da non poterselo figurare.", en: "stopped, spellbound, to watch him, and laughed and laughed and laughed, more than you could imagine.", note: "incantata — spellbound | si fermava a guardarlo — stopped to look at him | da non poterselo figurare — beyond what you could imagine" },
      { it: "Alla fine, e per buona fortuna, capitò un carabiniere", en: "In the end, and by good luck, a carabiniere happened along", note: "alla fine — in the end | per buona fortuna — luckily | capitò — happened to turn up | carabiniere — Italian military police officer" },
      { it: "il quale, sentendo tutto quello schiamazzo, e credendo si trattasse di un puledro che avesse levata la mano al padrone,", en: "who, hearing all that uproar, and thinking it was a colt that had turned on its master,", note: "schiamazzo — uproar, din | credendo si trattasse di — thinking it was a case of (subjunctive after credere) | puledro — colt | levar la mano al padrone — to rebel against its master (levare la mano = to raise a hand against)" },
      { it: "si piantò coraggiosamente a gambe larghe in mezzo alla strada,", en: "planted himself bravely, legs apart, in the middle of the street,", note: "piantarsi — to plant oneself | coraggiosamente — bravely | a gambe larghe — legs wide apart | in mezzo a — in the middle of" },
      { it: "con l'animo risoluto di fermarlo e di impedire il caso di maggiori disgrazie.", en: "determined to stop it and to prevent any chance of greater misfortunes.", note: "con l'animo risoluto di — resolved to | impedire — to prevent | disgrazie — misfortunes, accidents" },
      { it: "Ma Pinocchio, quando si avvide da lontano del carabiniere, che barricava tutta la strada,", en: "But Pinocchio, when he noticed from far off the carabiniere, who was blocking the whole street,", note: "si avvide di — noticed (avvedersi, passato remoto) | da lontano — from a distance | barricare — to block off (barricade)" },
      { it: "s'ingegnò di passargli, per sorpresa, framezzo alle gambe, e invece fece fiasco.", en: "tried to slip between his legs by surprise, and instead failed miserably.", note: "ingegnarsi di — to try, to contrive to | framezzo alle gambe — between the legs | per sorpresa — by surprise | fare fiasco — to fail badly, to make a fiasco" },

// ── STATE ────────────────────────────────────────────────────────────────────

let currentSection = 'favourites';
let flipped = {};
let searchQuery = '';
let activeTag = 'all';

// Quiz state
let quizQuestions = [];
let quizSubmitted = false;

// Pronunciation cache: { sectionId: [pron strings] }
const pronCache = {};

// ── SPEECH ───────────────────────────────────────────────────────────────────

let italianVoice = null;

function loadVoices() {
  const voices = window.speechSynthesis.getVoices();
  italianVoice = voices.find(v => v.lang.startsWith('it')) || null;
}

if (window.speechSynthesis) {
  try {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  } catch(e) {}
}

function speakPhrase(text, btn, event) {
  event.stopPropagation();
  if (!window.speechSynthesis) return;

  // If already speaking this phrase, cancel it
  if (btn.classList.contains('speaking')) {
    window.speechSynthesis.cancel();
    btn.classList.remove('speaking');
    return;
  }

  // Cancel any other speech
  window.speechSynthesis.cancel();
  document.querySelectorAll('.card-speak.speaking').forEach(b => b.classList.remove('speaking'));

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'it-IT';
  utterance.rate = 0.85;
  if (italianVoice) utterance.voice = italianVoice;

  btn.classList.add('speaking');
  utterance.onend = () => btn.classList.remove('speaking');
  utterance.onerror = () => btn.classList.remove('speaking');

  window.speechSynthesis.speak(utterance);
}

// ── FAVOURITES ────────────────────────────────────────────────────────────────

function loadFavourites() {
  try {
    return new Set(JSON.parse(localStorage.getItem('puglia_favs') || '[]'));
  } catch(e) {
    return new Set();
  }
}

function saveFavourites() {
  try {
    localStorage.setItem('puglia_favs', JSON.stringify([...favourites]));
  } catch(e) {
    // localStorage not available — favourites won't persist this session
  }
}

let favourites = loadFavourites();

function getFavKey(sectionId, phraseIt) {
  return `${sectionId}::${phraseIt}`;
}

function toggleFavourite(btn, event) {
  event.stopPropagation();
  const sectionId = btn.dataset.section;
  const phraseIt = btn.dataset.it;
  const key = getFavKey(sectionId, phraseIt);
  if (favourites.has(key)) {
    favourites.delete(key);
    btn.classList.remove('starred');
    btn.title = 'Add to favourites';
  } else {
    favourites.add(key);
    btn.classList.add('starred');
    btn.title = 'Remove from favourites';
  }
  saveFavourites();
  buildNav(); // update count in nav
  if (currentSection === 'favourites') renderFavourites();
}

function renderFavourites() {
  const main = document.getElementById('main');
  const count = favourites.size;

  const favPhrases = []; // { sectionId, sectionTitle, sectionIcon, phrase, origIdx, pronIdx }
  sections.forEach(sec => {
    sec.phrases.forEach((p, idx) => {
      if (favourites.has(getFavKey(sec.id, p.it))) {
        favPhrases.push({ sectionId: sec.id, sectionTitle: sec.title, sectionIcon: sec.icon, phrase: p, origIdx: idx });
      }
    });
  });

  main.innerHTML = `
    <div class="section active">
      <div class="section-header">
        <span class="section-icon">⭐</span>
        <span class="section-title">Favourites</span>
        <span class="section-count">${count} saved</span>
      </div>
      <div class="phrase-grid" id="phraseGrid">
        ${favPhrases.length ? favPhrases.map((item, i) => renderFavCard(item, i)).join('') : `
          <div class="fav-empty">
            <span class="fav-empty-star">★</span>
            No favourites yet — tap the star on any phrase card to save it here.
          </div>
        `}
      </div>
    </div>
  `;
}

function renderFavCard(item, i) {
  const { sectionId, sectionTitle, sectionIcon, phrase: p, origIdx } = item;
  const key = `fav_${i}`;
  const isFlipped = flipped[key];
  const prons = pronCache[sectionId];
  const pron = prons ? prons[origIdx] : null;
  const pronHTML = isFlipped && pron ? `<div class="card-pron">🔊 ${pron}</div>` : '';
  const noteBlock = isFlipped ? noteHTML(sectionId, p) : '';
  const favKey = getFavKey(sectionId, p.it);
  return `
    <div class="card ${isFlipped ? 'flipped' : ''}" onclick="flipFavCard(${i})">
      <button class="card-star starred" data-section="${sectionId}" data-it="${p.it.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"
        onclick="toggleFavourite(this, event)"
        title="Remove from favourites">★</button>
      <span class="card-flip-hint">${isFlipped ? '↩ back' : 'tap to reveal'}</span>
      <div class="card-section-label">${sectionIcon} ${sectionTitle}</div>
      <div class="card-italian">${p.it}</div>
      <div class="card-english">${isFlipped ? p.en : ''}</div>
      ${pronHTML}
      ${noteBlock}
      <button class="card-speak"
        data-speak="${p.it.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"
        onclick="speakPhrase(this.dataset.speak, this, event)"
        title="Listen">🔈</button>
    </div>
  `;
}

function flipFavCard(i) {
  const key = `fav_${i}`;
  flipped[key] = !flipped[key];
  const grid = document.getElementById('phraseGrid');
  if (!grid) return;
  const cards = grid.querySelectorAll('.card');
  if (!cards[i]) return;

  // Rebuild favourites list to get phrase info
  const favPhrases = [];
  sections.forEach(sec => {
    sec.phrases.forEach((p, idx) => {
      if (favourites.has(getFavKey(sec.id, p.it))) {
        favPhrases.push({ sectionId: sec.id, phrase: p, origIdx: idx });
      }
    });
  });

  const item = favPhrases[i];
  if (!item) return;
  const { sectionId, phrase: p, origIdx } = item;
  const card = cards[i];
  const isFlipped = flipped[key];

  card.className = `card ${isFlipped ? 'flipped' : ''}`;
  card.querySelector('.card-flip-hint').textContent = isFlipped ? '↩ back' : 'tap to reveal';
  card.querySelector('.card-english').textContent = isFlipped ? p.en : '';

  const existingNote = card.querySelector('.card-wordnotes');
  if (existingNote) existingNote.remove();
  if (isFlipped) {
    const nh = noteHTML(sectionId, p);
    if (nh) card.querySelector('.card-speak').insertAdjacentHTML('beforebegin', nh);
  }

  const existingPron = card.querySelector('.card-pron');
  if (existingPron) existingPron.remove();
  if (isFlipped) {
    const prons = pronCache[sectionId];
    if (prons && prons[origIdx]) {
      const pronEl = document.createElement('div');
      pronEl.className = 'card-pron';
      pronEl.textContent = '🔊 ' + prons[origIdx];
      card.querySelector('.card-english').insertAdjacentElement('afterend', pronEl);
    }
  }
}

// ── HELPERS ──────────────────────────────────────────────────────────────────

function noteHTML(sectionId, p) {
  const sec = sections.find(s => s.id === sectionId);
  if (!sec || !sec.showNotes || !p.note) return '';
  const items = p.note.split(' | ').map(e => {
    const i = e.indexOf(' — ');
    return i > -1
      ? `<div><b>${e.slice(0, i)}</b> ${e.slice(i + 3)}</div>`
      : `<div>${e}</div>`;
  }).join('');
  return `<div class="card-wordnotes">${items}</div>`;
}

function getAllPhrases() {
  const all = [];
  sections.filter(s => s.id !== 'foodbank' && !s.noQuiz).forEach(s => s.phrases.forEach(p => all.push(p)));
  return all;
}

function pickRandom(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function normalise(str) {
  return str
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s\/]/g, '')
    .replace(/\s*\/\s*/g, ' / ')
    .replace(/\s+/g, ' ')
    .trim();
}

function expandContractions(str) {
  return str
    .replace(/what's/gi, 'what is')
    .replace(/it's/gi, 'it is')
    .replace(/there's/gi, 'there is')
    .replace(/that's/gi, 'that is')
    .replace(/where's/gi, 'where is')
    .replace(/how's/gi, 'how is')
    .replace(/who's/gi, 'who is')
    .replace(/don't/gi, 'do not')
    .replace(/doesn't/gi, 'does not')
    .replace(/can't/gi, 'cannot')
    .replace(/won't/gi, 'will not')
    .replace(/isn't/gi, 'is not')
    .replace(/aren't/gi, 'are not')
    .replace(/i'm/gi, 'i am')
    .replace(/i've/gi, 'i have')
    .replace(/i'll/gi, 'i will')
    .replace(/you're/gi, 'you are')
    .replace(/we're/gi, 'we are')
    .replace(/they're/gi, 'they are')
    .replace(/he's/gi, 'he is')
    .replace(/she's/gi, 'she is');
}

function wordOverlap(a, b) {
  const wordsA = a.split(' ').filter(w => w.length > 2);
  const wordsB = new Set(b.split(' ').filter(w => w.length > 2));
  if (wordsA.length === 0) return 0;
  return wordsA.filter(w => wordsB.has(w)).length / wordsA.length;
}

function isAnswerCorrect(userRaw, correctRaw) {
  if (!userRaw || userRaw.trim() === '') return false;
  const user = normalise(expandContractions(userRaw));
  const correct = normalise(expandContractions(correctRaw));
  if (user === correct) return true;
  const alts = correct.split(' / ').map(a => a.trim());
  return alts.some(alt => {
    if (alt === user) return true;
    if (alt.length > 3 && (alt.includes(user) || user.includes(alt))) return true;
    // Accept if 80%+ of significant words match in either direction
    if (wordOverlap(user, alt) >= 0.8 || wordOverlap(alt, user) >= 0.8) return true;
    return false;
  });
}

function scoreMessage(score) {
  if (score === 10) return 'Perfetto! You\'re ready for Italy.';
  if (score >= 8)  return 'Ottimo! Really impressive.';
  if (score >= 6)  return 'Bene! Solid effort — keep going.';
  if (score >= 4)  return 'Non male. A bit more study needed!';
  return 'Keep practising — you\'ll get there!';
}

}

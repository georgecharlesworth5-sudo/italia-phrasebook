function loadPronunciations(sectionId) {
  if (!pronCache[sectionId] && pronData[sectionId]) {
    pronCache[sectionId] = pronData[sectionId];
  }
}

let openGroup = null;
let openBook = null;

function groupOf(id) {
  const sec = sections.find(x => x.id === id);
  return sec && sec.group === 'book' ? 'book' : 'phrasebook';
}

function toggleNav(g) {
  openGroup = openGroup === g ? null : g;
  if (openGroup === 'book' && !openBook) { const cs = sections.find(x => x.id === currentSection); openBook = cs && cs.book ? cs.book : sections.find(x => x.book).book; }
  buildNav();
}

function closeNav() {
  openGroup = null;
}

function buildNav() {
  const all = [
    { id: 'favourites', icon: '⭐', title: `Favourites${favourites.size ? ' (' + favourites.size + ')' : ''}`, group: 'phrasebook' },
    ...sections.map(x => ({ id: x.id, icon: x.icon, title: x.title, book: x.book, group: x.group === 'book' ? 'book' : 'phrasebook' })),
    { id: 'quiz', icon: '✏️', title: 'Quiz', group: 'phrasebook' }
  ];
  const cur = all.find(x => x.id === currentSection) || all[0];
  ['phrasebook', 'book'].forEach(g => {
    const active = cur.group === g;
    document.getElementById('navToggle-' + g).classList.toggle('active', active);
    document.getElementById('navToggle-' + g).classList.toggle('open', openGroup === g);
    document.getElementById('navArrow-' + g).classList.toggle('open', openGroup === g);
    document.getElementById('navSub-' + g).textContent = active ? cur.title : (g === 'book' ? 'Chapters' : 'Sections');
  });
  const dd = document.getElementById('navDropdown');
  dd.classList.toggle('open', !!openGroup);
  const item = x => `
    <button class="nav-item ${x.id === currentSection ? 'active' : ''}"
            onclick="switchSection('${x.id}')">
      <span class="nav-item-icon">${x.icon}</span>
      <span class="nav-item-label">${x.book ? x.title.replace(x.book + ' · ', '') : x.title}</span>
      ${x.id === currentSection ? '<span class="nav-item-tick">✓</span>' : ''}
    </button>`;
  if (openGroup === 'book') {
    const books = [...new Set(all.filter(x => x.book).map(x => x.book))];
    dd.innerHTML = books.map(bk => `
      <button class="nav-book ${openBook === bk ? 'open' : ''}" onclick="toggleBook('${bk.replace(/'/g, "\'")}')">
        <span>${bk}</span><span class="nav-arrow ${openBook === bk ? 'open' : ''}">▾</span>
      </button>
      ${openBook === bk ? all.filter(x => x.book === bk).map(item).join('') : ''}`).join('');
  } else {
    dd.innerHTML = openGroup ? all.filter(x => x.group === openGroup).map(item).join('') : '';
  }
}

function toggleBook(bk) {
  openBook = openBook === bk ? null : bk;
  buildNav();
}

function switchSection(id) {
  currentSection = id;
  searchQuery = '';
  activeTag = 'all';
  flipped = {};
  closeNav();
  buildNav();
  if (id === 'quiz') {
    renderQuizIntro();
  } else if (id === 'favourites') {
    renderFavourites();
    sections.forEach(sec => {
      if ([...favourites].some(k => k.startsWith(sec.id + '::'))) {
        loadPronunciations(sec.id);
      }
    });
  } else {
    renderSection();
    loadPronunciations(id);
  }
}

// ── PHRASE SECTION ───────────────────────────────────────────────────────────

function renderSection() {
  const sec = sections.find(s => s.id === currentSection);
  const main = document.getElementById('main');

  let phrases = sec.phrases;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    phrases = phrases.filter(p =>
      p.it.toLowerCase().includes(q) ||
      p.en.toLowerCase().includes(q) ||
      (p.note && p.note.toLowerCase().includes(q))
    );
  }

  const total = sec.phrases.length;
  const visible = phrases.length;

  main.innerHTML = `
    <div class="section active">
      <div class="section-header">
        <span class="section-icon">${sec.icon}</span>
        <span class="section-title">${sec.title}</span>
        <span class="section-count">${visible} / ${total} ${sec.unit || 'phrases'}</span>
      </div>

      <div class="search-bar">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          placeholder="Search phrases..."
          value="${searchQuery}"
          oninput="handleSearch(this.value)"
        >
      </div>

      <div class="phrase-grid${sec.reading ? ' reading' : ''}" id="phraseGrid">
        ${phrases.length ? phrases.map((p, i) => renderCard(p, i)).join('') :
          '<div class="no-results">No phrases match your search.</div>'}
      </div>

      ${sec.tip ? `
        <div class="study-tip">
          <strong>💡 Study Tip</strong>
          ${sec.tip}
        </div>
      ` : ''}
    </div>
  `;
}

function renderCard(p, i) {
  const key = `${currentSection}_${i}`;
  const isFlipped = flipped[key];
  const prons = pronCache[currentSection];
  const pron = prons ? prons[i] : null;
  const pronHTML = isFlipped && pron ? `<div class="card-pron">🔊 ${pron}</div>` : '';
  const noteBlock = isFlipped ? noteHTML(currentSection, p) : '';
  const favKey = getFavKey(currentSection, p.it);
  const isStarred = favourites.has(favKey);
  return `
    <div class="card ${isFlipped ? 'flipped' : ''}" onclick="flipCard(${i})">
      <button class="card-star ${isStarred ? 'starred' : ''}"
        data-section="${currentSection}" data-it="${p.it.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"
        onclick="toggleFavourite(this, event)"
        title="${isStarred ? 'Remove from favourites' : 'Add to favourites'}">★</button>
      <span class="card-flip-hint">${isFlipped ? '↩ back' : 'tap to reveal'}</span>
      <div class="card-italian">${p.it}</div>
      <div class="card-english">${isFlipped ? p.en : ''}</div>
      ${pronHTML}
      ${noteBlock}
      <button class="card-speak"
        data-speak="${p.it.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"
        onclick="speakPhrase(this.dataset.speak, this, event)"
        title="Listen">🔈</button>
    </div>
  `;
}

function flipCard(i) {
  const sec = sections.find(s => s.id === currentSection);
  let phrases = sec.phrases;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    phrases = phrases.filter(p =>
      p.it.toLowerCase().includes(q) ||
      p.en.toLowerCase().includes(q) ||
      (p.note && p.note.toLowerCase().includes(q))
    );
  }
  const p = phrases[i];
  const origIdx = sec.phrases.indexOf(p);
  const key = `${currentSection}_${origIdx}`;
  flipped[key] = !flipped[key];

  const grid = document.getElementById('phraseGrid');
  if (grid) {
    const cards = grid.querySelectorAll('.card');
    if (cards[i]) {
      const card = cards[i];
      const isFlipped = flipped[key];
      card.className = `card ${isFlipped ? 'flipped' : ''}`;
      card.querySelector('.card-flip-hint').textContent = isFlipped ? '↩ back' : 'tap to reveal';
      card.querySelector('.card-english').textContent = isFlipped ? p.en : '';

      // Word notes (reading sections only)
      const existingNote = card.querySelector('.card-wordnotes');
      if (existingNote) existingNote.remove();
      if (isFlipped) {
        const nh = noteHTML(currentSection, p);
        if (nh) card.querySelector('.card-speak').insertAdjacentHTML('beforebegin', nh);
      }

      // Pronunciation
      const existingPron = card.querySelector('.card-pron, .card-pron-loading');
      if (existingPron) existingPron.remove();
      if (isFlipped) {
        const prons = pronCache[currentSection];
        const pronEl = document.createElement('div');
        if (prons && prons[origIdx]) {
          pronEl.className = 'card-pron';
          pronEl.textContent = '🔊 ' + prons[origIdx];
          card.querySelector('.card-english').insertAdjacentElement('afterend', pronEl);
        }
      }
    }
  }
}

function handleSearch(val) {
  searchQuery = val;
  renderSection();
}

// ── QUIZ ─────────────────────────────────────────────────────────────────────

function renderQuizIntro() {
  const total = getAllPhrases().length;
  document.getElementById('main').innerHTML = `
    <div class="section active">
      <div class="section-header">
        <span class="section-icon">✏️</span>
        <span class="section-title">Quiz</span>
      </div>
      <div class="quiz-intro">
        <p>10 random Italian phrases drawn from all ${total} entries across every section.<br>
        Type the English translation for each one. Spelling doesn't have to be perfect — close answers count.</p>
        <button class="quiz-btn" onclick="startQuiz()">Start Quiz</button>
      </div>
    </div>
  `;
}

function startQuiz() {
  quizQuestions = pickRandom(getAllPhrases(), 10);
  quizSubmitted = false;
  renderQuizQuestions();
}

function renderQuizQuestions() {
  const questionsHTML = quizQuestions.map((p, i) => `
    <div class="quiz-question" id="qq-${i}">
      <div class="quiz-q-meta">Question ${i + 1} of 10</div>
      <div class="quiz-italian">${p.it}</div>
      <input
        class="quiz-input"
        type="text"
        id="qi-${i}"
        placeholder="Your answer…"
        autocomplete="off"
        onkeydown="handleQuizKey(event, ${i})"
      >
      <button class="skip-btn" id="qskip-${i}" onclick="skipQuestion(${i})">Skip</button>
      <div class="quiz-feedback" id="qf-${i}"></div>
    </div>
  `).join('');

  document.getElementById('main').innerHTML = `
    <div class="section active">
      <div class="section-header">
        <span class="section-icon">✏️</span>
        <span class="section-title">Quiz</span>
        <span class="section-count">10 questions</span>
      </div>
      ${questionsHTML}
      <div class="quiz-actions">
        <button class="quiz-btn" onclick="submitQuiz()">Submit Answers</button>
        <button class="quiz-btn secondary" onclick="startQuiz()">New Quiz</button>
      </div>
    </div>
  `;
  document.querySelector('#qq-0 .quiz-input').focus();
}

function skipQuestion(i) {
  const input = document.getElementById(`qi-${i}`);
  const skipBtn = document.getElementById(`qskip-${i}`);
  input.value = '';
  input.disabled = true;
  input.placeholder = 'Skipped';
  skipBtn.style.display = 'none';
  const next = document.getElementById(`qi-${i + 1}`);
  if (next) next.focus();
}

function handleQuizKey(event, i) {
  if (event.key !== 'Enter') return;
  event.preventDefault();
  const next = document.getElementById(`qi-${i + 1}`);
  if (next) {
    next.focus();
  }
}

function submitQuiz() {
  if (quizSubmitted) return;
  quizSubmitted = true;
  let score = 0;

  quizQuestions.forEach((p, i) => {
    const input = document.getElementById(`qi-${i}`);
    const feedback = document.getElementById(`qf-${i}`);
    const skipBtn = document.getElementById(`qskip-${i}`);
    if (skipBtn) skipBtn.style.display = 'none';
    const userAnswer = input.value;
    const isSkipped = input.disabled && input.value === '';
    const isCorrect = !isSkipped && isAnswerCorrect(userAnswer, p.en);

    input.disabled = true;
    if (isCorrect) {
      score++;
      input.classList.add('correct');
      feedback.className = 'quiz-feedback correct';
      feedback.textContent = '✓ Correct';
    } else {
      input.classList.add('incorrect');
      feedback.className = 'quiz-feedback incorrect';
      feedback.innerHTML = `✗ The answer was: <span class="correct-answer">${p.en}</span>`;
    }
  });

  // Scroll to top and show score banner
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const header = document.querySelector('.section-header');
  const banner = document.createElement('div');
  banner.className = 'quiz-score-banner';
  banner.innerHTML = `
    <div class="quiz-score-number">${score}<span style="font-size:0.5em;color:var(--stone);">/10</span></div>
    <div class="quiz-score-label">Your Score</div>
    <div class="quiz-score-msg">${scoreMessage(score)}</div>
    <div class="quiz-tally">${score} correct · ${10 - score} to review</div>
    <button class="quiz-btn" onclick="startQuiz()">Try Again with New Questions</button>
  `;
  header.insertAdjacentElement('afterend', banner);

  // Replace submit button with retry only
  const actions = document.querySelector('.quiz-actions');
  if (actions) actions.remove();
}

// ── INIT ─────────────────────────────────────────────────────────────────────

buildNav();
renderFavourites();
loadPronunciations('essentials');
</script>
